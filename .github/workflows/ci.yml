name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Django backend dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: server
        run: python manage.py check

      - name: Install Node database microservice dependencies
        working-directory: server/database
        run: npm install

      - name: Run Node microservice sentiment tests
        working-directory: server/database
        run: npm test

      - name: Install React frontend dependencies
        working-directory: server/frontend
        run: npm install

      - name: Lint React frontend
        working-directory: server/frontend
        run: npm run lint

      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build

      - name: Build Django backend Docker image
        run: docker build -t django-backend:ci ./server

      - name: Build Node microservice Docker image
        run: docker build -t node-backend:ci ./server/database

      - name: Build React frontend Docker image
        run: docker build -t react-frontend:ci ./server/frontend
